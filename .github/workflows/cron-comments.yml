name: Collect Comments

on:
  # ① ranking 워크플로 성공 직후 자동 발동 (chain)
  workflow_run:
    workflows: ["Collect Naver Ranking"]
    types: [completed]
  # ② 6시간마다 fallback
  #    UTC 01:00 / 07:00 / 13:00 / 19:00
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "대상 기사 시간 윈도우"
        required: false
        default: "24"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_LEGACY_ANON_KEY: ${{ secrets.SUPABASE_LEGACY_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      - name: Collect comments
        run: |
          python -m scripts.collect_comments \
            --hours "${{ github.event.inputs.hours || '24' }}"
