name: Collect Comments

on:
  # 매시 15분 UTC (= KST :24) — 네이버 댓글 랭킹 업데이트(KST :15) 9분 후
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "대상 기사 시간 윈도우"
        required: false
        default: "24"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_LEGACY_ANON_KEY: ${{ secrets.SUPABASE_LEGACY_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Collect comments
        run: |
          python -m scripts.collect_comments \
            --hours "${{ github.event.inputs.hours || '24' }}"
