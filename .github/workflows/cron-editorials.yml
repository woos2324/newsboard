name: Collect Editorials

on:
  schedule:
    - cron: '30 22 * * *'  # KST 07:30 (매일 아침 사설 수집)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (DB 저장 없이 확인만)'
        required: false
        default: 'false'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run collect_editorials
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_LEGACY_ANON_KEY: ${{ secrets.SUPABASE_LEGACY_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          DEFAULT_AI_MODEL: ${{ secrets.DEFAULT_AI_MODEL }}
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python -m scripts.collect_editorials $DRY_ARG
