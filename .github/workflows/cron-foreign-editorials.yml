name: Collect Foreign Editorials

on:
  schedule:
    - cron: '0 22 * * *'   # KST 07:00 (UTC 22:00 전날)
  workflow_dispatch:
    inputs:
      source:
        description: '특정 매체 코드만 (mainichi/sankei/wapo/nyt/ft/scmp/wtimes). 비우면 --all'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (DB 저장 없이 확인만)'
        required: false
        default: 'false'
      backfill:
        description: '번역 백필만 (수집 안 함, body_ko=NULL 레코드 번역)'
        required: false
        default: 'false'

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run collect_foreign_editorials
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
        run: |
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            python -m scripts.collect_foreign_editorials --translate-backfill --backfill-limit 50
            exit 0
          fi

          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          if [ -n "${{ github.event.inputs.source }}" ]; then
            python -m scripts.collect_foreign_editorials --source "${{ github.event.inputs.source }}" $DRY_ARG
          else
            python -m scripts.collect_foreign_editorials --all $DRY_ARG
          fi
