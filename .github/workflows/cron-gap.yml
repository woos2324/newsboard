name: Detect Gap

on:
  # cluster 워크플로 성공 직후 자동 발동 (chain)
  workflow_run:
    workflows: ["Cluster Articles"]
    types: [completed]
  # 6시간마다 fallback (UTC 01:00 / 07:00 / 13:00 / 19:00)
  schedule:
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "검사 날짜 범위 (일)"
        required: false
        default: "1"
      min_competitors:
        description: "경쟁사 최소 보도 매체 수"
        required: false
        default: "2"
      dry_run:
        description: "dry-run (true/false)"
        required: false
        default: "false"

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_LEGACY_ANON_KEY: ${{ secrets.SUPABASE_LEGACY_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Detect gaps
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python -m scripts.detect_gap \
            --days "${{ github.event.inputs.days || '1' }}" \
            --min-competitors "${{ github.event.inputs.min_competitors || '2' }}" \
            $DRY
