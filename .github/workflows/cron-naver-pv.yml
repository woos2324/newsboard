name: Collect Naver PV

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 (KST 01:00) 1일 1회 — 전날 확정치 수집
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (DB 저장 없이 확인만)'
        required: false
        default: 'false'
      date:
        description: '수집 날짜 YYYYMMDD (기본: 어제 KST)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run collect_naver_pv
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_PARTNER_ID: ${{ secrets.NAVER_PARTNER_ID }}
          NAVER_PARTNER_PW: ${{ secrets.NAVER_PARTNER_PW }}
        run: |
          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python -m scripts.collect_naver_pv $DRY_ARG $DATE_ARG
