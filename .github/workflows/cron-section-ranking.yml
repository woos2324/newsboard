name: Collect Section Ranking

on:
  workflow_run:
    workflows: ["Collect Naver Ranking"]
    types: [completed]
  schedule:
    # UTC 02:00 / 08:00 / 14:00 / 20:00 (KST 11:00 / 17:00 / 23:00 / 05:00)
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "수집 날짜 YYYYMMDD (기본: KST 오늘)"
        required: false
      media:
        description: "대상 매체 normalized_name (공백 구분, 기본: 전체)"
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_LEGACY_ANON_KEY: ${{ secrets.SUPABASE_LEGACY_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Collect section ranking
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.media }}" ]; then
            ARGS="$ARGS --media ${{ github.event.inputs.media }}"
          fi
          python -m scripts.collect_section_ranking $ARGS
