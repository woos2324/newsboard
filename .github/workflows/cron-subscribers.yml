name: Collect Naver Subscribers

on:
  schedule:
    # UTC 23:00 = KST 08:00 (매일 아침 1회)
    # 구독자수는 자주 변동 없어 일 1회로 충분
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      media:
        description: "수집할 매체 normalized_name 공백구분 (비우면 전체)"
        required: false
        default: ""
      debug:
        description: "raw JSON 응답 일부 출력 (true/false)"
        required: false
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_LEGACY_ANON_KEY: ${{ secrets.SUPABASE_LEGACY_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Collect subscribers
        run: |
          MEDIA="${{ github.event.inputs.media }}"
          DEBUG_FLAG=""
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            DEBUG_FLAG="--debug"
          fi
          if [ -n "$MEDIA" ]; then
            python -m scripts.collect_subscribers --media $MEDIA $DEBUG_FLAG
          else
            python -m scripts.collect_subscribers $DEBUG_FLAG
          fi
